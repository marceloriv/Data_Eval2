name: Desplegar en la EC2 (via ssh)
on:
  push:
    branches:
      - deploy
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/data-eval2:latest
            # 2. Detener y borrar el contenedor viejo
            # Los datos NO se borrarán gracias al volumen que definiremos abajo
            docker stop mysql-db || true
            docker rm mysql-db || true
            # 3. Arrancar el nuevo contenedor mapeando puertos y volúmenes
            docker run -d \
              --name mysql-db \
              -p 3306:3306 \
              -v /home/${{secrets.EC2_USER}}/mysql_data:/var/lib/mysql \
              -e MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
              -e MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }} \
              -e MYSQL_USER=${{ secrets.MYSQL_USER }} \
              -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
              --restart always \
              ${{ secrets.DOCKERHUB_USERNAME }}/data-eval2:latest
